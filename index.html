<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GOLDEN RATIO — BTCUSDT.P</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root{
    --bg:#08090b; --panel:#0e1014; --line:#1b1f26; --grid:#15181e;
    --text:#c9ced6; --dim:#6b7280; --gold:#e0b040; --gold-dim:#8a6c2a;
    --up:#26a69a; --down:#ef5350; --blue:#4a90d9;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
    padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  .brand{font-size:15px;letter-spacing:.22em;color:var(--gold);font-weight:600}
  .sym{color:var(--dim);font-size:11px;letter-spacing:.1em}
  .price{margin-left:auto;font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .chg{font-size:12px;font-variant-numeric:tabular-nums}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block;margin-right:5px;vertical-align:middle}
  .dot.live{background:var(--up);box-shadow:0 0 6px var(--up)}
  .dot.err{background:var(--down)}

  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;
    padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  .ctl{display:flex;align-items:center;gap:5px;color:var(--dim);font-size:11px}
  select,input,button{font-family:var(--mono);font-size:12px;background:#12151b;color:var(--text);
    border:1px solid var(--line);border-radius:3px;padding:5px 7px;outline:none}
  input{width:58px;text-align:right;font-variant-numeric:tabular-nums}
  select:focus-visible,input:focus-visible,button:focus-visible{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold-dim)}
  button{cursor:pointer;color:var(--gold);border-color:var(--gold-dim)}
  button:active{background:#1a1610}
  .stamp{margin-left:auto;color:var(--dim);font-size:11px}

  main{display:grid;grid-template-columns:1fr 300px;gap:1px;background:var(--line);
    height:calc(100vh - 108px);height:calc(100dvh - 108px)}
  #chart{background:var(--bg);min-width:0}
  aside{background:var(--panel);overflow-y:auto;-webkit-overflow-scrolling:touch}

  .trigbox{padding:11px 13px;border-bottom:1px solid var(--line)}
  .trigbox h2{margin:0 0 7px;font-size:11px;font-weight:500;color:var(--dim);letter-spacing:.08em}
  .trigline{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 0;font-size:12px}
  .trigline span:last-child{font-variant-numeric:tabular-nums}
  .big{font-size:16px;font-variant-numeric:tabular-nums}

  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th{font-weight:500;color:var(--dim);font-size:10px;letter-spacing:.06em;text-align:right;
    padding:8px 13px 6px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
  th:first-child{text-align:left}
  td{padding:6px 13px;font-size:12px;text-align:right;border-bottom:1px solid #101319}
  td:first-child{text-align:left}
  tr.ext td:first-child{color:var(--dim)}
  tr.anchor{background:#0f1218}
  tr.here td{background:#161208}
  .swatch{display:inline-block;width:9px;height:2px;margin-right:7px;vertical-align:middle}
  .note{padding:10px 13px;color:var(--dim);font-size:11px;line-height:1.5}
  .empty{padding:22px 14px;color:var(--dim);font-size:12px;line-height:1.6}

  @media(max-width:820px){
    main{grid-template-columns:1fr;grid-template-rows:58vh auto;height:auto}
    #chart{height:58vh}
    .price{width:100%;margin:4px 0 0;font-size:22px}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="brand">GOLDEN RATIO</div>
  <div class="sym">BYBIT · BTCUSDT.P</div>
  <div class="price"><span class="dot" id="dot"></span><span id="px">—</span></div>
  <div class="chg" id="chg"></div>
</header>

<div class="controls">
  <label class="ctl">tf
    <select id="tf">
      <option value="15">15m</option>
      <option value="60" selected>1h</option>
      <option value="240">4h</option>
    </select>
  </label>
  <label class="ctl">move ≥
    <input id="thr" type="number" value="2" min="0.2" max="15" step="0.1"> %
  </label>
  <label class="ctl">show
    <select id="count">
      <option value="1">last 1</option>
      <option value="3" selected>last 3</option>
      <option value="5">last 5</option>
    </select>
  </label>
  <button id="reload">Reload</button>
  <div class="stamp" id="stamp">loading…</div>
</div>

<main>
  <div id="chart"></div>
  <aside>
    <div class="trigbox" id="trigbox"></div>
    <div id="tablewrap"></div>
    <div class="note">Levels below 0 extend past the end of the move (continuation). Levels above 1 extend past its origin. Triggers are evaluated on closed candles only.</div>
  </aside>
</main>

<script>
(() => {
  const API = 'https://api.bybit.com';
  const SYMBOL = 'BTCUSDT';

  // r = fib ratio. 0 = end of the trigger move, 1 = its origin.
  const LEVELS = [
    { r: -0.618, color: '#ef5350', dash: true  },
    { r: -0.272, color: '#ef5350', dash: true  },
    { r:  0,     color: '#787b86', dash: false },
    { r:  0.5,   color: '#4a90d9', dash: false },
    { r:  0.618, color: '#e0b040', dash: false },
    { r:  1,     color: '#787b86', dash: false },
    { r:  1.272, color: '#26a69a', dash: true  },
    { r:  1.618, color: '#26a69a', dash: true  },
  ];

  const el = id => document.getElementById(id);
  const fmt = n => n.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const tag = r => r === 0 ? '0' : r === 1 ? '1' : String(r);

  const chart = LightweightCharts.createChart(el('chart'), {
    layout: { background: { type: 'solid', color: '#08090b' }, textColor: '#6b7280', fontFamily: 'ui-monospace, monospace', fontSize: 11 },
    grid: { vertLines: { color: '#15181e' }, horzLines: { color: '#15181e' } },
    rightPriceScale: { borderColor: '#1b1f26', scaleMargins: { top: 0.12, bottom: 0.12 } },
    timeScale: { borderColor: '#1b1f26', timeVisible: true, secondsVisible: false, rightOffset: 8 },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal,
      vertLine: { color: '#3a4048', labelBackgroundColor: '#1b1f26' },
      horzLine: { color: '#3a4048', labelBackgroundColor: '#1b1f26' } },
    handleScale: { axisPressedMouseMove: true },
  });

  const candles = chart.addCandlestickSeries({
    upColor: '#26a69a', downColor: '#ef5350',
    borderUpColor: '#26a69a', borderDownColor: '#ef5350',
    wickUpColor: '#2e7d75', wickDownColor: '#a34643',
    priceFormat: { type: 'price', precision: 1, minMove: 0.1 },
  });

  new ResizeObserver(() => chart.applyOptions({
    width: el('chart').clientWidth, height: el('chart').clientHeight
  })).observe(el('chart'));

  let fibSeries = [];   // drawn level lines, cleared on every redraw
  let bars = [];        // closed candles only
  let live = null;      // last traded price
  let latest = null;    // most recent trigger

  const clearFibs = () => { fibSeries.forEach(s => chart.removeSeries(s)); fibSeries = []; };

  function anchorsOf(t) {
    // up move: 0 sits at the high (where the move ended), 1 at the low (where it began)
    return t.dir === 'up' ? { p0: t.high, p1: t.low } : { p0: t.low, p1: t.high };
  }
  const priceAt = (p0, p1, r) => p0 + (p1 - p0) * r;

  function findTriggers(thr) {
    const out = [];
    for (const b of bars) {
      const pct = ((b.close - b.open) / b.open) * 100;
      if (Math.abs(pct) >= thr) out.push({ ...b, pct, dir: pct > 0 ? 'up' : 'down' });
    }
    return out;
  }

  function drawFibs(triggers, keep) {
    clearFibs();
    const shown = triggers.slice(-keep);
    const lastTime = bars[bars.length - 1].time;
    const step = bars.length > 1 ? bars[1].time - bars[0].time : 3600;

    shown.forEach((t, i) => {
      const { p0, p1 } = anchorsOf(t);
      const isNewest = i === shown.length - 1;
      const next = shown[i + 1];
      const end = Math.min(next ? next.time : lastTime + step * 8, t.time + step * 90);
      const fade = isNewest ? 1 : 0.34;

      LEVELS.forEach(({ r, color, dash }) => {
        const s = chart.addLineSeries({
          color: fade === 1 ? color : color + '5c',
          lineWidth: r === 0.618 && isNewest ? 2 : 1,
          lineStyle: dash ? LightweightCharts.LineStyle.Dashed : LightweightCharts.LineStyle.Solid,
          priceLineVisible: false,
          lastValueVisible: isNewest,
          title: isNewest ? tag(r) : '',
          crosshairMarkerVisible: false,
        });
        const price = priceAt(p0, p1, r);
        s.setData([{ time: t.time, value: price }, { time: end, value: price }]);
        fibSeries.push(s);
      });
    });

    candles.setMarkers(shown.map(t => ({
      time: t.time,
      position: t.dir === 'up' ? 'belowBar' : 'aboveBar',
      color: t.dir === 'up' ? '#26a69a' : '#ef5350',
      shape: t.dir === 'up' ? 'arrowUp' : 'arrowDown',
      text: (t.pct > 0 ? '+' : '') + t.pct.toFixed(2) + '%',
    })));

    latest = shown[shown.length - 1] || null;
  }

  function renderPanel() {
    const box = el('trigbox'), wrap = el('tablewrap');
    if (!latest) {
      box.innerHTML = '';
      wrap.innerHTML = '<div class="empty">No candle has moved that far in the loaded history. Lower the threshold or switch timeframe.</div>';
      return;
    }
    const { p0, p1 } = anchorsOf(latest);
    const col = latest.dir === 'up' ? 'var(--up)' : 'var(--down)';
    const when = new Date(latest.time * 1000).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

    box.innerHTML = `
      <h2>Latest trigger</h2>
      <div class="trigline"><span>${latest.dir === 'up' ? 'Up candle' : 'Down candle'}</span>
        <span class="big" style="color:${col}">${latest.pct > 0 ? '+' : ''}${latest.pct.toFixed(2)}%</span></div>
      <div class="trigline"><span>Closed</span><span>${when}</span></div>
      <div class="trigline"><span>Range</span><span>${fmt(latest.low)} → ${fmt(latest.high)}</span></div>`;

    const rows = LEVELS.map(({ r, color }) => {
      const price = priceAt(p0, p1, r);
      const dist = live ? ((price - live) / live) * 100 : null;
      const cls = [];
      if (r < 0 || r > 1) cls.push('ext');
      if (r === 0 || r === 1) cls.push('anchor');
      return { r, color, price, dist, cls };
    });

    // mark the two levels straddling the live price
    if (live) {
      const above = rows.filter(x => x.price > live).sort((a, b) => a.price - b.price)[0];
      const below = rows.filter(x => x.price <= live).sort((a, b) => b.price - a.price)[0];
      [above, below].forEach(x => x && x.cls.push('here'));
    }

    wrap.innerHTML = `<table>
      <thead><tr><th>Level</th><th>Price</th><th>From spot</th></tr></thead>
      <tbody>${rows.map(x => `
        <tr class="${x.cls.join(' ')}">
          <td><i class="swatch" style="background:${x.color}"></i>${tag(x.r)}</td>
          <td>${fmt(x.price)}</td>
          <td style="color:${x.dist == null ? 'var(--dim)' : x.dist >= 0 ? 'var(--up)' : 'var(--down)'}">
            ${x.dist == null ? '—' : (x.dist >= 0 ? '+' : '') + x.dist.toFixed(2) + '%'}</td>
        </tr>`).join('')}
      </tbody></table>`;
  }

  async function loadCandles() {
    const tf = el('tf').value;
    const url = `${API}/v5/market/kline?category=linear&symbol=${SYMBOL}&interval=${tf}&limit=1000`;
    const r = await fetch(url);
    const j = await r.json();
    if (j.retCode !== 0) throw new Error(j.retMsg || 'kline request rejected');

    const all = j.result.list.map(k => ({
      time: Math.floor(+k[0] / 1000),
      open: +k[1], high: +k[2], low: +k[3], close: +k[4],
    })).sort((a, b) => a.time - b.time);

    // drop the candle still forming — no repainting signals
    const sec = (+tf) * 60;
    const nowSec = Math.floor(Date.now() / 1000);
    bars = all.filter(b => b.time + sec <= nowSec);

    candles.setData(bars);
    redraw();
    chart.timeScale().scrollToRealTime();
  }

  function redraw() {
    if (!bars.length) return;
    const thr = Math.max(0.1, parseFloat(el('thr').value) || 2);
    drawFibs(findTriggers(thr), parseInt(el('count').value, 10));
    renderPanel();
  }

  async function loadTicker() {
    const r = await fetch(`${API}/v5/market/tickers?category=linear&symbol=${SYMBOL}`);
    const j = await r.json();
    const t = j.result.list[0];
    live = +t.lastPrice;
    const chg = +t.price24hPcnt * 100;
    el('px').textContent = fmt(live);
    el('chg').textContent = `${chg >= 0 ? '+' : ''}${chg.toFixed(2)}% 24h`;
    el('chg').style.color = chg >= 0 ? 'var(--up)' : 'var(--down)';
    renderPanel();
  }

  function stamp(ok, msg) {
    el('dot').className = 'dot ' + (ok ? 'live' : 'err');
    el('stamp').textContent = msg;
    el('stamp').style.color = ok ? 'var(--dim)' : 'var(--down)';
  }

  async function refresh() {
    try {
      await Promise.all([loadCandles(), loadTicker()]);
      stamp(true, 'updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
    } catch (e) {
      stamp(false, 'Bybit unreachable — retrying');
    }
  }

  el('reload').onclick = refresh;
  el('tf').onchange = refresh;
  el('thr').oninput = redraw;
  el('count').onchange = redraw;

  refresh();
  setInterval(refresh, 30000);
  setInterval(() => loadTicker().catch(() => {}), 5000);
})();
</script>
</body>
</html>
